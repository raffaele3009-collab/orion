<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion — Notizie</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12182B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12182B;
    --panel:#1B2340;
    --panel-hover:#212B4D;
    --brass:#C9A227;
    --brass-soft:rgba(201,162,39,0.35);
    --parchment:#EDE6D6;
    --mist:#8B93A7;
    --green:#4FA57D;
    --coral:#C1584B;
    --line:rgba(139,147,167,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(201,162,39,0.06), transparent 40%),
      radial-gradient(ellipse at 80% 0%, rgba(79,165,125,0.05), transparent 35%);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:36px 20px 80px;}

  header{margin-bottom:28px;}
  .brand-row{margin-bottom:16px;}
  .utility-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .wordmark{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--parchment);
    flex-shrink:0;
  }
  .o-star{
    flex-shrink:0;
    margin:0 1px;
  }
  .o-star path{
    filter:drop-shadow(0 0 3px rgba(255,255,255,0.85)) drop-shadow(0 0 6px rgba(127,195,237,0.5));
  }
  .o-star circle{
    filter:drop-shadow(0 0 2px rgba(127,195,237,0.4));
  }
  .header-right{display:flex;align-items:center;gap:18px;}
  .date-greeting{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mist);letter-spacing:0.4px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--mist); cursor:pointer; transition:all .2s ease;
    background:transparent;
  }
  .icon-btn:hover{border-color:var(--brass-soft);color:var(--brass);}
  .icon-btn.active{border-color:var(--brass);color:var(--brass);}

  .search-bar{
    display:none;
    margin-top:14px;
  }
  .search-bar.show{display:flex;}
  .search-bar input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    color:var(--parchment);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    outline:none;
  }
  .search-bar input::placeholder{color:var(--mist);}
  .search-bar input:focus{border-color:var(--brass-soft);}

  /* vista compatta: nasconde i riassunti, card più strette */
  body.compact .summary{display:none;}
  body.compact .card{padding:11px 4px;}

  /* notizie già lette: si spengono visivamente ma restano al loro posto */
  .card.read{opacity:0.4;}
  .card.read .headline{color:var(--mist);}

  .load-more-btn{
    display:none;
    width:100%;
    margin:8px 0 30px;
    padding:13px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--mist);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.4px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .load-more-btn.show{display:block;}
  .load-more-btn:hover{border-color:var(--brass-soft);color:var(--brass);}

  .feed-counter{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--mist);
    letter-spacing:0.3px;
    margin-top:6px;
  }

  .retry-banner{
    background:rgba(201,162,39,0.1);
    border:1px solid var(--brass-soft);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:16px;
    font-size:13px;
    color:var(--parchment);
    cursor:pointer;
    text-align:center;
  }
  .retry-banner:hover{border-color:var(--brass);}

  /* Lettore articolo dentro l'app */
  .reader-overlay{
    position:fixed;
    inset:0;
    background:var(--ink);
    z-index:1000;
    display:none;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .25s ease;
  }
  .reader-overlay.open{
    display:flex;
    transform:translateY(0);
  }
  .reader-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .reader-close{
    background:transparent;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--mist);
    padding:8px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    cursor:pointer;
  }
  .reader-close:hover{border-color:var(--brass-soft);color:var(--brass);}
  .reader-external{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--brass);
    text-decoration:none;
  }
  .reader-body{
    position:relative;
    flex:1;
    min-height:0;
  }
  .reader-frame{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .reader-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--mist);
    background:var(--ink);
  }
  .reader-loading.hide{display:none;}
  .reader-fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    text-align:center;
    padding:0 30px;
    background:var(--ink);
  }
  .reader-fallback.show{display:flex;}
  .reader-fallback p{
    color:var(--parchment);
    font-size:15px;
    line-height:1.5;
  }
  .reader-fallback-btn{
    background:transparent;
    border:1px solid var(--brass-soft);
    border-radius:10px;
    color:var(--brass);
    padding:12px 22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    cursor:pointer;
  }
  .reader-fallback-btn:hover{border-color:var(--brass);}

  .summary-card{
    background:var(--panel);
    border:1px solid var(--brass-soft);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .summary-card .summary-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:8px;
  }
  .summary-card p{
    font-size:14px;
    line-height:1.55;
    color:var(--parchment);
  }

  /* Constellation nav */
  .constellation-card{
    background:
      radial-gradient(ellipse at 28% 15%, rgba(127,195,237,0.08), transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(79,165,125,0.04), transparent 50%),
      #0E1226;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 20px 14px;
    margin-bottom:32px;
  }
  .constellation-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--mist);
    margin-bottom:10px;
  }
  #constellation{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;}
  .skeleton-line{stroke:rgba(159,196,237,0.3);stroke-width:1.1;}
  .star{cursor:pointer;transition:all .25s ease;outline:none;}
  .star:focus{outline:none;}
  .star-halo{fill:url(#glowDim);transition:all .3s ease;}
  .star.active .star-halo{fill:url(#glowBright);}
  .star.active .star-halo{fill:url(#glowBright);}
  .star-core{fill:#3A4468;stroke:#6B7796;stroke-width:1.2;transition:all .25s ease;}
  .star.active .star-core{fill:#EAF6FF;stroke:#BFE3FF;}
  .star-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;
    fill:var(--mist);
    opacity:0.75;
    letter-spacing:0.3px;
    transition:all .25s ease;
  }
  .star.active .star-label{fill:#DCEEFC;opacity:1;}
  .star:hover .star-core{stroke:#BFE3FF;}
  .bg-star{fill:#CFE6FA;}

  /* Feed */
  .day-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--mist);
    margin:30px 0 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .day-label::after{content:'';flex:1;height:1px;background:var(--line);}

  .card{
    padding:18px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .15s ease;
  }
  .card:hover{background:rgba(255,255,255,0.015);}
  .card:hover .headline{color:var(--brass);}
  .meta{
    display:flex;align-items:center;gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--mist);
    margin-bottom:8px;
    letter-spacing:0.3px;
  }
  .tag{
    padding:2px 7px;
    border-radius:20px;
    border:1px solid var(--line);
    text-transform:uppercase;
    font-size:9px;
    letter-spacing:0.6px;
  }
  .tag.macro{color:#9FB4D9;border-color:rgba(159,180,217,0.35);}
  .tag.crypto{color:var(--brass);border-color:var(--brass-soft);}
  .tag.azioni{color:var(--green);border-color:rgba(79,165,125,0.35);}
  .tag.obbligazioni{color:#B79FD9;border-color:rgba(183,159,217,0.35);}
  .tag.materie{color:var(--coral);border-color:rgba(193,88,75,0.35);}
  .tag.forex{color:#7FC3ED;border-color:rgba(127,195,237,0.4);}

  .headline{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:19px;
    line-height:1.35;
    color:var(--parchment);
    margin:0 0 6px;
    transition:color .15s ease;
  }
  .summary{
    font-size:13.5px;
    line-height:1.55;
    color:var(--mist);
    margin:0;
    max-width:600px;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--mist);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    line-height:1.7;
    display:none;
  }
  .empty-state.show{display:block;}
  .loading-state{
    text-align:center;
    padding:50px 20px;
    color:var(--mist);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.3px;
  }

  @media(max-width:520px){
    .headline{font-size:17px;}
    .wordmark{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-row">
      <div class="wordmark">ORI<svg class="o-star" viewBox="0 0 40 40" width="24" height="24" aria-hidden="true">

      <button class="reader-fallback-btn" id="readerFallbackBtn">Tocca per andare al sito</button>

    { title:"Negli USA i sussidi di disoccupazione salgono più del previsto", summary:"Il dato riaccende le attese di un mercato del lavoro in raffreddamento, dollaro in leggero calo.", source:"Investing.com", category:"macro", publishedAt: hoursAgo(29), link:"https://www.investing.com/" },
    { title:"Ethereum, in arrivo un aggiornamento chiave sulla scalabilità della rete", summary:"Gli sviluppatori confermano la data della prossima fork sulla mainnet.", source:"Reuters", category:"crypto", publishedAt: hoursAgo(32), link:"https://www.reuters.com/business/" },
    { title:"Yen ai minimi da mesi, la Banca del Giappone resta a guardare", summary:"Il cambio USD/JPY sfiora quota 158, cresce la pressione per un intervento verbale delle autorità.", source:"Investing.com", category:"forex", publishedAt: hoursAgo(35), link:"https://www.investing.com/" },
  ];
  function hoursAgo(h){ return new Date(Date.now() - h*3600*1000).toISOString(); }

  // ---------------------------------------------------------------------
  // 2. Rendering
  // ---------------------------------------------------------------------
  const feedEl = document.getElementById('feed');
  const emptyState = document.getElementById('emptyState');
  const summariesEl = document.getElementById('summaries');
  let categorySummaries = {};
  let stars = document.querySelectorAll('.star'); // già presenti nell'SVG statico

  // --- ricorda quali stelle erano accese, tra una visita e l'altra ---
  (function restoreStarSelection(){
    const saved = localStorage.getItem('orion-active-cats');
    if (saved === null) return; // prima visita: restano quelle di default nell'SVG
    const activeCats = new Set(JSON.parse(saved));
    stars.forEach(star => {
      star.classList.toggle('active', activeCats.has(star.dataset.cat));
    });
  })();

  function saveStarSelection(){
    const activeCats = [...stars].filter(s => s.classList.contains('active')).map(s => s.dataset.cat);
    localStorage.setItem('orion-active-cats', JSON.stringify(activeCats));
  }

  // --- notizie lette: salvate sul telefono, nessun account richiesto ---
  let readLinks;
  try {
    readLinks = new Set(JSON.parse(localStorage.getItem('orion-read') || '[]'));
  } catch { readLinks = new Set(); }

  function markAsRead(link, cardEl){
    readLinks.add(link);
    cardEl.classList.add('read');
    // teniamo solo gli ultimi 500 link letti, altrimenti lo storage cresce all'infinito
    const trimmed = [...readLinks].slice(-500);
    localStorage.setItem('orion-read', JSON.stringify(trimmed));
    if (hideRead) applyFilter(false);
  }

  function renderSummaries(){
    summariesEl.innerHTML = '';
    const activeCats = [...stars].filter(s => s.classList.contains('active')).map(s => s.dataset.cat);
    activeCats.forEach(cat => {
      const text = categorySummaries[cat];
      if (!text) return;
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <div class="summary-label">Il punto — ${CATEGORY_LABELS[cat] || cat}</div>
        <p>${text}</p>
      `;
      summariesEl.appendChild(card);
    });
  }

  function dayLabelFor(iso){
    const d = new Date(iso);
    const today = new Date();
    const diffDays = Math.floor((today.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
    if (diffDays <= 0) return 'Oggi';
    if (diffDays === 1) return 'Ieri';
    return d.toLocaleDateString('it-IT', { day:'numeric', month:'long' });
  }

  // ---------------------------------------------------------------------
  // 2b. Lettore articolo dentro l'app: apre il sito in un pannello sopra Orion.
  // Alcuni siti bloccano attivamente l'incorporamento (X-Frame-Options/CSP):
  // non c'è un modo sicuro al 100% per saperlo in anticipo da fuori, quindi
  // usiamo un tempo massimo di attesa — se l'iframe non carica in tempo,
  // mostriamo il messaggio con il link per andare al sito vero.
  // ---------------------------------------------------------------------
  const readerOverlay = document.getElementById('readerOverlay');
  const readerFrame = document.getElementById('readerFrame');
  const readerLoading = document.getElementById('readerLoading');
  const readerFallback = document.getElementById('readerFallback');
  const readerExternal = document.getElementById('readerExternal');
  const readerClose = document.getElementById('readerClose');
  const readerFallbackBtn = document.getElementById('readerFallbackBtn');
  let readerTimer = null;

  function openReader(link){
    readerExternal.href = link;
    readerFallbackBtn.onclick = () => { window.open(link, '_blank'); closeReader(); };
    readerLoading.classList.remove('hide');
    readerFallback.classList.remove('show');
    readerFrame.style.visibility = 'hidden';
    readerFrame.src = link;
    readerOverlay.classList.add('open');

    clearTimeout(readerTimer);
    readerTimer = setTimeout(() => {
      // il sito non ha dato segno di vita in tempo: probabilmente blocca l'incorporamento
      readerLoading.classList.add('hide');
      readerFallback.classList.add('show');
      readerFrame.style.visibility = 'hidden';
    }, 4000);

    readerFrame.onload = () => {
      clearTimeout(readerTimer);
      readerLoading.classList.add('hide');
      readerFrame.style.visibility = 'visible';
    };
  }

  function closeReader(){
    readerOverlay.classList.remove('open');
    clearTimeout(readerTimer);
    readerFrame.src = 'about:blank'; // ferma il caricamento e libera memoria
  }

  readerClose.addEventListener('click', closeReader);

  function renderArticles(articles){
    feedEl.innerHTML = '';
    if (!articles.length) return;

    let currentDay = null;
    for (const a of articles) {
      const day = dayLabelFor(a.publishedAt);
      if (day !== currentDay) {
        currentDay = day;
        const label = document.createElement('div');
        label.className = 'day-label';
        label.textContent = day;
        feedEl.appendChild(label);
      }
      const time = new Date(a.publishedAt).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.cat = a.category;
      card.dataset.search = `${a.title} ${a.summary || ''} ${a.source}`.toLowerCase();
      if (a.link && readLinks.has(a.link)) card.classList.add('read');
      card.innerHTML = `
        <div class="meta"><span>${time}</span><span>·</span><span>${a.source}</span><span class="tag ${a.category}">${CATEGORY_LABELS[a.category] || a.category}</span></div>
        <p class="headline">${a.title}</p>
        <p class="summary">${a.summary || ''}</p>
      `;
      if (a.link) {
        card.addEventListener('click', () => {
          openReader(a.link);
          markAsRead(a.link, card);
        });
      }
      feedEl.appendChild(card);
    }

    applyFilter();
  }

  // ---------------------------------------------------------------------
  // 3. Filtro: stella attiva/inattiva + ricerca testuale + paginazione
  // ---------------------------------------------------------------------
  let searchQuery = '';
  let hideRead = localStorage.getItem('orion-hide-read') === '1';
  const PAGE_SIZE = 20;
  let visibleLimit = PAGE_SIZE;
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const feedCounter = document.getElementById('feedCounter');

  function applyFilter(resetPage = true){
    if (resetPage) visibleLimit = PAGE_SIZE;

    const active = new Set(
      [...stars].filter(s => s.classList.contains('active')).map(s => s.dataset.cat)
    );

    // FASE 1: capiamo quali card rispettano stella+ricerca+letti (tutte, senza limite)
    const allCards = [...feedEl.querySelectorAll('.card')];
    const matching = allCards.filter(card => {
      const matchesCategory = active.has(card.dataset.cat);
      const matchesSearch = !searchQuery || card.dataset.search.includes(searchQuery);
      const matchesRead = !hideRead || !card.classList.contains('read');
      return matchesCategory && matchesSearch && matchesRead;
    });

    // FASE 2: delle card che rispettano i filtri, mostriamo solo le prime "visibleLimit"
    allCards.forEach(card => { card.style.display = 'none'; });
    const toShow = matching.slice(0, visibleLimit);
    toShow.forEach(card => { card.style.display = ''; });

    feedEl.querySelectorAll('.day-label').forEach(label => {
      let el = label.nextElementSibling;
      let hasVisible = false;
      while (el && !el.classList.contains('day-label')) {
        if (el.classList.contains('card') && el.style.display !== 'none') hasVisible = true;
        el = el.nextElementSibling;
      }
      label.style.display = hasVisible ? '' : 'none';
    });

    emptyState.classList.toggle('show', toShow.length === 0);
    loadMoreBtn.classList.toggle('show', matching.length > toShow.length);
    feedCounter.textContent = matching.length
      ? `Mostrando ${toShow.length} di ${matching.length} notizie`
      : '';
  }

  loadMoreBtn.addEventListener('click', () => {
    visibleLimit += PAGE_SIZE;
    applyFilter(false); // false = non tornare alla prima pagina
  });

  stars.forEach(star => {
    star.addEventListener('click', () => {
      star.classList.toggle('active');
      saveStarSelection();
      applyFilter();
      renderSummaries();
    });
  });

  // ---------------------------------------------------------------------
  // 3b. Barra di ricerca: si apre/chiude col pulsante ⌕, filtra mentre scrivi
  // ---------------------------------------------------------------------
  const searchBtn = document.getElementById('searchBtn');
  const searchBar = document.getElementById('searchBar');
  const searchInput = document.getElementById('searchInput');

  searchBtn.addEventListener('click', () => {
    const opening = !searchBar.classList.contains('show');
    searchBar.classList.toggle('show');
    searchBtn.classList.toggle('active', opening);
    if (opening) {
      searchInput.focus();
    } else {
      searchInput.value = '';
      searchQuery = '';
      applyFilter();
    }
  });

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    applyFilter();
  });

  // ---------------------------------------------------------------------
  // 3c. Vista compatta: nasconde i riassunti, si ricorda la scelta
  // ---------------------------------------------------------------------
  const compactBtn = document.getElementById('compactBtn');

  function setCompact(on){
    document.body.classList.toggle('compact', on);
    compactBtn.classList.toggle('active', on);
    localStorage.setItem('orion-compact', on ? '1' : '0');
  }

  compactBtn.addEventListener('click', () => {
    setCompact(!document.body.classList.contains('compact'));
  });

  setCompact(localStorage.getItem('orion-compact') === '1');

  // ---------------------------------------------------------------------
  // 3d. Nascondi già lette: interruttore, ricordato tra una visita e l'altra
  // ---------------------------------------------------------------------
  const hideReadBtn = document.getElementById('hideReadBtn');
  hideReadBtn.classList.toggle('active', hideRead);

  hideReadBtn.addEventListener('click', () => {
    hideRead = !hideRead;
    hideReadBtn.classList.toggle('active', hideRead);
    localStorage.setItem('orion-hide-read', hideRead ? '1' : '0');
    applyFilter();
  });

  // ---------------------------------------------------------------------
  // 4. Caricamento: prova il backend live (con un tentativo extra per il
  // "risveglio" di Render se il servizio dormiva), altrimenti dati demo
  // ---------------------------------------------------------------------
  function fetchWithTimeout(url, ms){
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), ms);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(t));
  }

  async function loadFeed(){
    // 1° tentativo: 8 secondi, basta se il servizio è già sveglio
    // 2° tentativo: 55 secondi, per quando Render deve svegliare il servizio
    // gratuito da fermo (può metterci anche 30-50 secondi la prima volta)
    for (const timeoutMs of [8000, 55000]) {
      try {
        if (timeoutMs > 8000) {
          const loading = document.getElementById('loadingState');
          if (loading) loading.textContent = 'Il server si sta svegliando, un attimo di pazienza…';
        }
        const res = await fetchWithTimeout(API_URL, timeoutMs);
        if (!res.ok) throw new Error('risposta non ok');
        const json = await res.json();
        categorySummaries = json.summaries || {};
        renderArticles(json.articles || []);
        renderSummaries();
        return; // riuscito, non serve altro tentativo
      } catch (err) {
        console.warn(`[orion] tentativo fallito (${timeoutMs}ms):`, err.message);
      }
    }
    // entrambi i tentativi falliti: mostra i dati demo, ma con un modo per riprovare
    console.warn('[orion] backend non raggiungibile, uso i dati demo');
    categorySummaries = {};
    renderArticles(DEMO_ARTICLES);
    renderSummaries();
    showRetryBanner();
  }

  function showRetryBanner(){
    const banner = document.createElement('div');
    banner.className = 'retry-banner';
    banner.textContent = 'Non riesco a contattare il server — sto mostrando notizie di esempio. Tocca qui per riprovare.';
    banner.addEventListener('click', () => {
      banner.remove();
      const loading = document.getElementById('loadingState');
      if (loading) loading.textContent = 'Riprovo…';
      loadFeed();
    });
    feedEl.parentNode.insertBefore(banner, feedEl);
  }

  loadFeed();

  // ---------------------------------------------------------------------
  // 5. PWA — registra il service worker (per installabilità + apertura offline)
  // ---------------------------------------------------------------------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch((err) => {
        console.warn('[orion] service worker non registrato:', err.message);
      });
    });
  }
</script>
</body>
</html>
